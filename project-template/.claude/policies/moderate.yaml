profile: moderate

filesystem:
  deny:
    - ".env"
    - ".env.*"
    - "secrets/**"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "credentials.*"
  allow:
    - "src/**"
    - "docs/**"
    - "tests/**"
    - ".claude/**"

network:
  mode: unrestricted
  allowlist: []

hooks:
  pre_tool_use:
    - matcher: "Bash"
      command: "if echo \"$CLAUDE_TOOL_INPUT\" | grep -qE '^git (commit|push)'; then echo '=== Staged files ===' && git diff --cached --name-only; fi"
  post_tool_use: []

sandbox:
  enabled: false
  runtime: auto
  writable_mounts: []
  env_passthrough: []
  image_base: "node:22-slim"
